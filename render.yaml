services:
  - type: web
    name: tn-traffic-intelligence
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TN_WEB_MODE
        value: "1"
      - key: TN_LOCAL_MODELS_ONLY
        value: "1"
      - key: TN_COOKIE_SECURE
        value: "1"
      - key: TN_PRELOAD_FOUNDATION
        value: "0"
      - key: TN_MAX_SESSIONS
        value: "20"
      - key: TN_SESSION_TTL_SECONDS
        value: "1800"
      - key: TN_MAX_MODEL_JOBS
        value: "1"
      - key: TN_REQUESTS_PER_MINUTE
        value: "180"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
