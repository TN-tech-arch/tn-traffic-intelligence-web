services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8088:7860"
    environment:
      TN_COOKIE_SECURE: "0"
      TN_PRELOAD_FOUNDATION: "0"
      TN_SESSION_TTL_SECONDS: "7200"
      TN_MAX_SESSIONS: "8"
      TN_MAX_MODEL_JOBS: "2"
    volumes:
      - ./models_cache:/tmp/tn-model-cache
    restart: unless-stopped
